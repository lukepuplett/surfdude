version: 2

project_name: surfdude

before:
  hooks:
    - sh -c "cd go && go mod tidy"

builds:
  - id: surf
    dir: go
    main: ./cmd/surf
    binary: surf
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE*
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  use: github

release:
  github:
    owner: lukepuplett
    name: surfdude-csharp
  name_template: "v{{ .Version }}"
