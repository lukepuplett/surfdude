pool:
  vmImage: 'ubuntu-latest'

steps:
- task: DeleteFiles@1
  inputs:
    sourceFolder: '$(Agent.BuildDirectory)'
    contents: '**/*.nupkg'

- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: 'csharp/Evoq.Surfdude.sln'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: 'csharp/Evoq.Surfdude.sln'
    arguments: '--configuration Release --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: 'csharp/tests/Evoq.Surfdude.Tests/Evoq.Surfdude.Tests.csproj'
    arguments: '--configuration Release --no-build --no-restore'
    publishTestResults: true

- task: DotNetCoreCLI@2
  displayName: 'Pack NuGet packages'
  inputs:
    command: 'pack'
    configuration: 'Release'
    packagesToPack: 'csharp/src/**/Evoq.Surfdude*.csproj'
    packDirectory: '$(build.artifactStagingDirectory)'
    verbosityPack: 'normal'
    nobuild: true

- task: PowerShell@2
  displayName: 'Push to NuGet.org'
  inputs:
    targetType: 'filePath'
    filePath: 'csharp/build/Publish-ToNuGet.ps1'
    arguments: '-PackageSpec $(Build.ArtifactStagingDirectory)/Surfdude*.nupkg -ApiKey $(azure-pipelines-evoq-nuget-apikey)'
