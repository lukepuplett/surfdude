pool:
  vmImage: 'ubuntu-latest'

# CI only — publishing is tag-driven on GitHub Actions. See docs/releasing.md.

trigger:
  branches:
    include:
      - master
      - main

steps:
- task: UseDotNet@2
  displayName: 'Install .NET SDK'
  inputs:
    packageType: 'sdk'
    version: '10.x'

- task: DotNetCoreCLI@2
  displayName: 'Restore'
  inputs:
    command: 'restore'
    projects: 'csharp/Evoq.Surfdude.sln'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: 'csharp/Evoq.Surfdude.sln'
    arguments: '--configuration Release --no-restore'

- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: 'csharp/tests/Evoq.Surfdude.Tests/Evoq.Surfdude.Tests.csproj'
    arguments: '--configuration Release --no-build --no-restore'
    publishTestResults: true
