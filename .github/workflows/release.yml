name: Release

# Push a semver tag vX.Y.Z (after scripts/tag-release/bump-version.sh and tests).
# PyPI: trusted publisher on PyPI (GitHub → release.yml, env pypi). NuGet is manual/off for now.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION file
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          file="$(tr -d '[:space:]' < VERSION)"
          test "$tag" = "$file"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.sum
      - run: go test ./...
        working-directory: go
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups && uv run pytest
        working-directory: python
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test csharp/Evoq.Surfdude.sln -c Release

  publish:
    needs: verify
    runs-on: ubuntu-latest
    environment: pypi
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_RELEASE_PAT || github.token }}

      - name: Tag Go module (go/vX.Y.Z)
        run: |
          set -euo pipefail
          ver="${GITHUB_REF#refs/tags/}"
          modtag="go/${ver}"
          if git ls-remote --exit-code origin "refs/tags/${modtag}" >/dev/null 2>&1; then
            echo "${modtag} already on origin — skipping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$modtag" "${{ github.sha }}"
          git push origin "$modtag"

      - uses: astral-sh/setup-uv@v5
      - name: Publish to PyPI (trusted publisher)
        working-directory: python
        run: |
          set -euo pipefail
          uv build
          uv publish

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
