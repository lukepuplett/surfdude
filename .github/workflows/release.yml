name: Release

# Push a semver tag vX.Y.Z (after scripts/tag-release/bump-version.sh and tests).
# Add repository secret PYPI_API_TOKEN for PyPI (Account settings → API tokens). NuGet is manual/off for now.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches VERSION file
        run: |
          set -euo pipefail
          tag="${GITHUB_REF#refs/tags/v}"
          file="$(tr -d '[:space:]' < VERSION)"
          test "$tag" = "$file"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: go/go.sum
      - run: go test ./...
        working-directory: go
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-groups && uv run pytest
        working-directory: python
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet test csharp/Evoq.Surfdude.sln -c Release

  publish:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag Go module (go/vX.Y.Z)
        run: |
          set -euo pipefail
          ver="${GITHUB_REF#refs/tags/}"
          modtag="go/${ver}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$modtag" "${{ github.sha }}"
          git push origin "$modtag"

      - uses: astral-sh/setup-uv@v5
      - name: Publish to PyPI
        env:
          PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        working-directory: python
        run: |
          set -euo pipefail
          uv build
          if [ -z "${PYPI_API_TOKEN:-}" ]; then
            echo "PYPI_API_TOKEN not set — skipping upload (see python/dist/)."
            ls -la dist/
            exit 0
          fi
          UV_PUBLISH_TOKEN="$PYPI_API_TOKEN" uv publish

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
